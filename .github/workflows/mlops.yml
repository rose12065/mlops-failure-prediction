name: MLOps Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      failure_mode:
        description: "Select failure mode for experiment"
        required: true
        default: "none"
        type: choice
        options:
          - none
          - training

jobs:
  mlops:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        id: tests
        run: pytest

      - name: Train ML model
        id: train
        env:
          FAILURE_MODE: ${{ inputs.failure_mode || 'none' }}
        run: python src/train.py

      - name: Calculate changed files
        id: changes
        if: always()
        run: |
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            COUNT=$(git diff --name-only HEAD^ HEAD | wc -l)
          else
            COUNT=0
          fi
          echo "changed_files=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Record pipeline run
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
          COMMIT_ID: ${{ github.sha }}
          PIPELINE_STATUS: ${{ job.status }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          TRAIN_OUTCOME: ${{ steps.train.outcome }}
          CHANGED_FILES: ${{ steps.changes.outputs.changed_files }}
        run: python src/record_run.py

      - name: Upload pipeline data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-run-${{ github.run_id }}
          path: data/pipeline_runs.csv