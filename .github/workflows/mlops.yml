name: MLOps Pipeline

on:
  push:
  pull_request:

jobs:
  mlops:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        id: tests
        run: pytest

      - name: Train ML model
        id: train
        run: python src/train.py

      - name: Record pipeline run
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
          COMMIT_ID: ${{ github.sha }}
          PIPELINE_STATUS: ${{ job.status }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          TRAIN_OUTCOME: ${{ steps.train.outcome }}
        run: python src/record_run.py

      - name: Upload pipeline data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-run-${{ github.run_id }}
          path: data/pipeline_runs.csv